name = "map-daddy"
main = "src/index.js"
compatibility_date = "2026-05-01"

[vars]
CORS_ORIGINS = "*"

[[kv_namespaces]]
binding = "SCENES"
id = "replace_with_your_kv_namespace_id"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "replace_with_your_r2_bucket_name"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ProjectionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectionRoom"]
