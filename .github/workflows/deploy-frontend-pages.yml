name: Deploy Frontend to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          VITE_MAP_DADDY_API_URL: ${{ vars.VITE_MAP_DADDY_API_URL }}
          VITE_MAP_DADDY_RELAY_URL: ${{ vars.VITE_MAP_DADDY_RELAY_URL }}
          VITE_MAP_DADDY_PUBLIC_BACKEND_URL: ${{ vars.VITE_MAP_DADDY_PUBLIC_BACKEND_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
