name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            relay/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Install relay dependencies
        run: npm ci
        working-directory: relay
      - name: Check relay syntax
        run: node --check server.js
        working-directory: relay
      - name: Install receiver dependencies
        run: python -m pip install -r renderer-pi/requirements.txt
      - name: Compile Python
        run: python -m compileall backend/main.py renderer-pi/mapdaddy_receiver.py renderer-pi/src
